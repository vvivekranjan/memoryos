[project]
name = "aimemoryos"
version = "0.1.2"
description = "A long-term semantic and episodic memory OS for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.9.0",
    "faiss-cpu>=1.8.0",
    "google-cloud-aiplatform>=3.0.0",
    "kuzu>=0.0.1",
    "loguru>=0.7.2",
    "numpy>=1.24.0,<3.0.0",
    "openrouter>=0.0.1",
    "orjson>=3.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.7.0",
    "structlog>=23.0.0",
    "unstructured[docx,pptx]>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aimemoryos*"]
